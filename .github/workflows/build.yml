name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # 發布 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: Build native (x64)
        run: |
          cmake -B build-x64 -A x64
          cmake --build build-x64 --config Release

      - name: Build native (x86)
        run: |
          cmake -B build-x86 -A Win32
          cmake --build build-x86 --config Release

      - name: Publish GUI (WPF, self-contained)
        run: dotnet publish gui/LocaleBridge.csproj -c Release -r win-x64 --self-contained -o publish_gui

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish_gui/* dist/ -Recurse -Force
          Copy-Item build-x64/Release/LocaleHook64.dll   dist/
          Copy-Item build-x64/Release/LocaleLoader64.exe dist/
          Copy-Item build-x86/Release/LocaleHook32.dll   dist/
          Copy-Item build-x86/Release/LocaleLoader32.exe dist/
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: LocaleBridge
          path: dist/

      # ---- 打 tag（v*）時，打包成 zip 並發布 GitHub Release ----
      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "LocaleBridge-${{ github.ref_name }}.zip"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          "LocaleBridge-${{ github.ref_name }}.zip"
          --repo ${{ github.repository }}
          --title ${{ github.ref_name }}
          --notes "LocaleBridge ${{ github.ref_name }} — 解壓後執行 LocaleBridge.exe。詳見 README。"
